                        </div>
                        {/* Name + actions */}
                        <div style={{ padding: "8px 10px" }}>
                          <div style={{ fontSize: 12, fontWeight: 600, color: "#3A2E22", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={file.name}>{file.name}</div>
                          <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                            {(isImg || isPdf || is3dm) && (
                              <button onClick={e => { e.stopPropagation(); handleClick(); }}
                                style={{ flex: 1, padding: "4px 0", fontSize: 10, fontWeight: 700, background: "#F0EBE2", border: "none", borderRadius: 5, cursor: "pointer", color: "#5A4A38" }}>
                                {isPdf ? "📄 Öppna" : is3dm ? "◈ 3D-vy" : "👁 Visa"}
                              </button>
                            )}
                            <a href={rawUrl} download target="_blank" rel="noreferrer" onClick={e => e.stopPropagation()}
                              style={{ flex: 1, padding: "4px 0", fontSize: 10, fontWeight: 700, background: "#E8F0EC", border: "none", borderRadius: 5, cursor: "pointer", color: "#3A5A4A", textDecoration: "none", textAlign: "center" }}>↓ Ladda ner</a>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
              <GithubUploader targetPath={activeFolder.path} onDone={() => openFolder(activeFolder)} />
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


// ─── Rhino 3D Viewer ───
function Rhino3DViewer({ pendingUrl, onPendingConsumed }) {
  const containerRef = useRef(null);
  const rendererRef = useRef(null);
  const sceneRef = useRef(null);
  const cameraRef = useRef(null);
  const animRef = useRef(null);
  const isDragging = useRef(false);
  const isPanning = useRef(false);
  const prevMouse = useRef({ x: 0, y: 0 });
  const rotation = useRef({ x: 0.5, y: -0.8 }); // elevation, azimuth (Z-up perspective)
  const panOffset = useRef(new THREE.Vector3(0, 0, 0));
  const zoomRef = useRef(1);

  const [status, setStatus] = useState("idle"); // idle | loading | ready | error
  const [errorMsg, setErrorMsg] = useState("");
  const [driveUrl, setDriveUrl] = useState("");
  const [modelInfo, setModelInfo] = useState(null);
  const [rhinoModule, setRhinoModule] = useState(null);
  const [layers, setLayers] = useState([]); // [{ name, color, visible, index }]
  const sceneObjects = useRef([]); // [{ threeObj, layerIndex }]

  // Load rhino3dm WASM module on mount
  useEffect(() => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/rhino3dm@8.4.0/rhino3dm.min.js";
    script.onload = () => {
      if (window.rhino3dm) {
        window.rhino3dm().then(m => { setRhinoModule(m); });
      }
    };
    document.head.appendChild(script);
    return () => { if (animRef.current) cancelAnimationFrame(animRef.current); };
  }, []);

  // Auto-load when navigated from file browser
  useEffect(() => {
    if (pendingUrl && rhinoModule) {
      setDriveUrl(pendingUrl);
      if (onPendingConsumed) onPendingConsumed();
      setTimeout(() => loadFromDrive(pendingUrl), 100);
    }
  }, [pendingUrl, rhinoModule]);

  // Initialize Three.js scene
  useEffect(() => {
    if (!containerRef.current) return;
    const w = containerRef.current.clientWidth;
    const h = containerRef.current.clientHeight || 500;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xF5F0E6);

    const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
    camera.up.set(0, 0, 1); // Z-up like Rhino
    camera.position.set(30, -40, 30);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    containerRef.current.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 50, 80);
    scene.add(dirLight);
    const dirLight2 = new THREE.DirectionalLight(0xD4A76A, 0.3);
    dirLight2.position.set(-30, -40, -20);
    scene.add(dirLight2);

    // Grid on XY plane (Z-up, like Rhino)
    const grid = new THREE.GridHelper(100, 20, 0xDDD5C8, 0xE5DDD0);
    grid.rotation.x = Math.PI / 2; // rotate to XY plane
    scene.add(grid);

    sceneRef.current = scene;
    cameraRef.current = camera;
    rendererRef.current = renderer;

    const animate = () => {
      animRef.current = requestAnimationFrame(animate);
      renderer.render(scene, camera);
    };
    animate();

    // Raycaster for finding orbit pivot point
    const raycaster = new THREE.Raycaster();
    const mouseNdc = new THREE.Vector2();
    let pendingPivot = null;

    function findPivotAt(clientX, clientY) {
      const rect = el.getBoundingClientRect();
      mouseNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouseNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouseNdc, camera);
      const meshes = [];
      scene.traverse(child => { if (child.isMesh && child.visible) meshes.push(child); });
      const hits = raycaster.intersectObjects(meshes, false);
      if (hits.length > 0) return hits[0].point.clone();
      return null;
    }

    function applyPivot(pivot) {
      const cam = cameraRef.current;
      if (!cam || !pivot) return;
      const offset = cam.position.clone().sub(pivot);
      const dist = offset.length();
      if (dist < 0.001) return;
      zoomRef.current = dist / 50;
      rotation.current.x = Math.asin(Math.max(-0.999, Math.min(0.999, offset.z / dist)));
      rotation.current.y = Math.atan2(offset.y, offset.x);
      panOffset.current.copy(pivot);
      // Don't call updateCamera here — angles already match current position
    }

    // Mouse/touch controls: left=rotate, middle=pan, scroll=zoom
    const el = renderer.domElement;
    const onDown = (e) => {
      if (e.touches) {
        isDragging.current = true;
        const pt = e.touches[0];
        prevMouse.current = { x: pt.clientX, y: pt.clientY };
        pendingPivot = findPivotAt(pt.clientX, pt.clientY);
      } else if (e.button === 1 || e.button === 2) {
        e.preventDefault();
        isPanning.current = true;
        prevMouse.current = { x: e.clientX, y: e.clientY };
      } else {
        isDragging.current = true;
        prevMouse.current = { x: e.clientX, y: e.clientY };
        pendingPivot = findPivotAt(e.clientX, e.clientY);
      }
    };
    const onMove = (e) => {
      const pt = e.touches ? e.touches[0] : e;
      const dx = pt.clientX - prevMouse.current.x;
      const dy = pt.clientY - prevMouse.current.y;
      prevMouse.current = { x: pt.clientX, y: pt.clientY };

      if (isPanning.current) {
        // Pan in camera screen space
        const panSpeed = 0.002 * 50 * zoomRef.current;
        const cam = cameraRef.current;
        if (cam) {
          const right = new THREE.Vector3();
          const up = new THREE.Vector3();
          right.setFromMatrixColumn(cam.matrixWorld, 0);
          up.setFromMatrixColumn(cam.matrixWorld, 1);
          panOffset.current.addScaledVector(right, -dx * panSpeed);
          panOffset.current.addScaledVector(up, dy * panSpeed);
        }
        updateCamera();
      } else if (isDragging.current) {
        // Only apply pivot if mouse has actually moved (threshold: 3px)
        const moved = Math.abs(dx) + Math.abs(dy);
        if (pendingPivot && moved > 2) {
          applyPivot(pendingPivot);
          pendingPivot = null;
        }
        // Rotate
        rotation.current.y -= dx * 0.005;
        rotation.current.x += dy * 0.005;
        rotation.current.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.current.x));
        updateCamera();
      }
    };
    const onUp = () => { isDragging.current = false; isPanning.current = false; pendingPivot = null; };
    const onWheel = (e) => { e.preventDefault(); zoomRef.current = Math.max(0.05, Math.min(50, zoomRef.current * (1 + e.deltaY * 0.001))); updateCamera(); };
    const onContextMenu = (e) => { e.preventDefault(); }; // prevent right-click menu

    el.addEventListener("mousedown", onDown);
    el.addEventListener("mousemove", onMove);
    el.addEventListener("mouseup", onUp);
    el.addEventListener("mouseleave", onUp);
    el.addEventListener("touchstart", onDown, { passive: true });
    el.addEventListener("touchmove", onMove, { passive: true });
    el.addEventListener("touchend", onUp);
    el.addEventListener("wheel", onWheel, { passive: false });
    el.addEventListener("contextmenu", onContextMenu);

    const onResize = () => {
      if (!containerRef.current || !containerRef.current.parentElement) return;
      const nw = containerRef.current.parentElement.clientWidth;
      const nh = containerRef.current.parentElement.clientHeight || 500;
      camera.aspect = nw / nh;
      camera.updateProjectionMatrix();
      renderer.setSize(nw, nh);
    };
    window.addEventListener("resize", onResize);

    return () => {
      if (animRef.current) cancelAnimationFrame(animRef.current);
      window.removeEventListener("resize", onResize);
      renderer.dispose();
    };
  }, []);

  function updateCamera() {
    if (!cameraRef.current || !sceneRef.current) return;
    const dist = 50 * zoomRef.current;
    const elevation = rotation.current.x; // up/down angle from XY plane
    const azimuth = rotation.current.y;   // rotation around Z axis
    const target = panOffset.current;
    cameraRef.current.position.set(
      target.x + dist * Math.cos(elevation) * Math.cos(azimuth),
      target.y + dist * Math.cos(elevation) * Math.sin(azimuth),
      target.z + dist * Math.sin(elevation)
    );
    cameraRef.current.lookAt(target);
  }

  function clearModel() {
    if (!sceneRef.current) return;
    const toRemove = [];
    sceneRef.current.traverse(child => { if (child.isMesh || child.isLine) toRemove.push(child); });
    toRemove.forEach(obj => { sceneRef.current.remove(obj); if (obj.geometry) obj.geometry.dispose(); if (obj.material) obj.material.dispose(); });
  }

  async function loadFromDrive(urlOverride) {
    const targetUrl = (urlOverride || driveUrl || "").trim();
    if (!targetUrl) return;
    if (!rhinoModule) { setErrorMsg("rhino3dm laddas fortfarande, vänta en stund…"); return; }

    setStatus("loading");
    setErrorMsg("");
    setModelInfo(null);

    try {
      // Build fetch URL — GitHub raw doesn't need proxy, Drive does
      let fetchUrl;
      if (isGithubUrl(targetUrl)) {
        fetchUrl = toGithubRaw(targetUrl);
      } else if (isGdriveUrl(targetUrl)) {
        if (!isProxyConfigured()) { setErrorMsg("CORS-proxy ej konfigurerad. Fyll i CORS_PROXY_URL i koden."); setStatus("error"); return; }
        const patterns = [/\/file\/d\/([a-zA-Z0-9_-]+)/, /id=([a-zA-Z0-9_-]+)/, /\/d\/([a-zA-Z0-9_-]+)/];
        let fileId = null;
        for (const p of patterns) { const m = targetUrl.match(p); if (m) { fileId = m[1]; break; } }
        if (!fileId) throw new Error("Ogiltig Google Drive-länk");
        const downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
        fetchUrl = `${CORS_PROXY_URL}?url=${encodeURIComponent(downloadUrl)}`;
      } else {
        fetchUrl = isProxyConfigured()
          ? `${CORS_PROXY_URL}?url=${encodeURIComponent(targetUrl)}`
          : targetUrl;
      }

      const res = await fetch(fetchUrl);
      if (!res.ok) throw new Error(`Nedladdningsfel: HTTP ${res.status}`);

      const buffer = await res.arrayBuffer();
      const arr = new Uint8Array(buffer);

      // Verify it's a .3dm file
      const headerStr = new TextDecoder().decode(arr.slice(0, 20));
      if (!headerStr.startsWith("3D Geometry File")) {
        throw new Error("Filen verkar inte vara en giltig .3dm-fil. Kontrollera att Google Drive-delningen är 'Alla med länken'.");
      }

      // Parse .3dm file
      const doc = rhinoModule.File3dm.fromByteArray(arr);
      if (!doc) throw new Error("Kunde inte läsa .3dm-filen — filen kan vara skadad eller i ett format som inte stöds");

      clearModel();
      sceneObjects.current = [];

      // Extract layers and their visibility
      const rhinoLayers = doc.layers();
      const layerInfo = [];
      const visibleLayerIndices = new Set();
      for (let li = 0; li < rhinoLayers.count; li++) {
        const layer = rhinoLayers.get(li);
        const name = layer.name || `Lager ${li}`;
        const visible = layer.visible;
        const color = layer.color;
        const colorHex = color ? `rgb(${color.r},${color.g},${color.b})` : "#8B7355";
        layerInfo.push({ name, color: colorHex, visible, index: li });
        if (visible) visibleLayerIndices.add(li);
        console.log(`Lager ${li}: "${name}" visible=${visible} color=rgb(${color?.r},${color?.g},${color?.b})`);
      }
      setLayers(layerInfo);

      const objects = doc.objects();
      let meshCount = 0, curveCount = 0, skippedCount = 0;
      const defaultMat = new THREE.MeshPhongMaterial({ color: 0x8B7355, side: THREE.DoubleSide, flatShading: false });
      const lineMat = new THREE.LineBasicMaterial({ color: 0x5A4A38 });
      const allPositions = [];

      console.log(`Rhino fil laddad: ${objects.count} objekt`);

      for (let i = 0; i < objects.count; i++) {
        try {
          const rhinoObj = objects.get(i);
          const geo = rhinoObj.geometry();
          if (!geo) { skippedCount++; continue; }

          // Check layer visibility — load all objects but hide those on hidden layers
          const attr = rhinoObj.attributes();
          const layerIndex = attr.layerIndex;
          const layerVisible = visibleLayerIndices.has(layerIndex);

          const objectType = geo.objectType;
          const typeName = geo.constructor.name;
          console.log(`Objekt ${i}: type=${objectType}, constructor=${typeName}`);

          // Detect type using multiple methods (objectType can be number or enum object)
          const typeNum = typeof objectType === "number" ? objectType : parseInt(String(objectType));
          const isMesh = typeNum === 32 || typeName === "Mesh";
          const isBrep = typeNum === 16 || typeName === "Brep";
          const isExtrusion = typeNum === 1073741824 || typeName === "Extrusion";
          const isSurface = typeNum === 8 || typeName === "Surface" || typeName === "NurbsSurface";
          const isSubD = typeNum === 256 || typeName === "SubD";
          const isCurve = typeNum === 4 || typeName === "NurbsCurve" || typeName === "LineCurve" || typeName === "PolylineCurve" || typeName === "ArcCurve" || typeName === "Curve";

          // Try to get a mesh from any geometry type
          let rhinoMesh = null;

          if (isMesh) {
            rhinoMesh = geo;
          } else if (isExtrusion) {
            try {
              const brep = geo.toBrep ? geo.toBrep() : null;
              if (brep) {
                const faceCount = brep.faces().count;
                for (let fi = 0; fi < faceCount; fi++) {
                  const face = brep.faces().get(fi);
                  const faceMesh = face.getMesh(rhinoModule.MeshType.Any);
                  if (faceMesh) { addMeshToScene(faceMesh, rhinoObj, doc, layerVisible); meshCount++; }
                }
                brep.delete();
                continue;
              }
            } catch(e) { console.log("Extrusion conversion failed:", e); }
          } else if (isBrep) {
            try {
              const faceCount = geo.faces().count;
              console.log(`  Brep har ${faceCount} faces`);
              let gotMesh = false;
              for (let fi = 0; fi < faceCount; fi++) {
                const face = geo.faces().get(fi);
                try {
                  const faceMesh = face.getMesh(rhinoModule.MeshType.Any);
                  if (faceMesh) { addMeshToScene(faceMesh, rhinoObj, doc, layerVisible); meshCount++; gotMesh = true; }
                  else { console.log(`  Face ${fi}: getMesh returned null — prova att använda "Mesh" i Rhino innan export`); }
                } catch(faceErr) { console.log(`  Face ${fi} getMesh error:`, faceErr); }
              }
              if (gotMesh) continue;
              // Fallback: try toMesh on the brep directly
              console.log("  Försöker toMesh() på hela Brep:en...");
            } catch(e) { console.log("Brep face mesh extraction failed:", e); }
          } else if (isSurface) {
            try {
              const brep = geo.toBrep ? geo.toBrep() : null;
              if (brep) {
                const faceCount = brep.faces().count;
                for (let fi = 0; fi < faceCount; fi++) {
                  const face = brep.faces().get(fi);
                  const faceMesh = face.getMesh(rhinoModule.MeshType.Any);
                  if (faceMesh) { addMeshToScene(faceMesh, rhinoObj, doc, layerVisible); meshCount++; }
                }
                brep.delete();
                continue;
              }
            } catch(e) { console.log("Surface conversion failed:", e); }
          } else if (isSubD) {
            try { if (geo.toMesh) rhinoMesh = geo.toMesh(0); } catch(e) { console.log("SubD conversion failed:", e); }
          }

          // Handle direct mesh
          if (rhinoMesh) {
            addMeshToScene(rhinoMesh, rhinoObj, doc, layerVisible);
            meshCount++;
            continue;
          }

          // Last resort: try generic toMesh or createMesh
          if (!isCurve) {
            try {
              if (typeof geo.toMesh === "function") {
                const fallbackMesh = geo.toMesh();
                if (fallbackMesh) {
                  console.log(`  Fallback toMesh() lyckades för objekt ${i}`);
                  addMeshToScene(fallbackMesh, rhinoObj, doc, layerVisible);
                  meshCount++;
                  continue;
                }
              }
            } catch(e) { console.log("  Fallback toMesh failed:", e); }

            // Try to extract edges as wireframe
            try {
              if (isBrep && geo.edges) {
                const edges = geo.edges();
                console.log(`  Försöker extrahera ${edges.count} kanter som wireframe...`);
                for (let ei = 0; ei < edges.count; ei++) {
                  try {
                    const edge = edges.get(ei);
                    const edgeCurve = edge.toNurbsCurve ? edge.toNurbsCurve() : edge.edgeCurve;
                    if (edgeCurve) {
                      addCurveToScene(edgeCurve, rhinoObj, layerVisible);
                      curveCount++;
                    }
                  } catch(ee) { /* skip individual edge */ }
                }
                continue;
              }
            } catch(e) { console.log("  Edge extraction failed:", e); }
          }

          // Handle curves
          if (isCurve) {
            try {
              addCurveToScene(geo, rhinoObj, layerVisible);              curveCount++;
              continue;
            } catch(e) { console.log("Curve parsing failed:", e); }
          }

          // Handle point objects, annotations etc — skip silently
          skippedCount++;

        } catch (objErr) {
          console.warn(`Kunde inte läsa objekt ${i}:`, objErr);
          skippedCount++;
        }
      }

      function addMeshToScene(rhinoMesh, rhinoObj, doc, isVisible) {
        try {
          const verts = rhinoMesh.vertices();
          const faces = rhinoMesh.faces();
          if (!verts || verts.count === 0) return;

          const positions = [];
          for (let v = 0; v < verts.count; v++) {
            const pt = verts.get(v);
            // pt can be [x,y,z] or {x,y,z} depending on version
            const x = pt[0] !== undefined ? pt[0] : pt.x;
            const y = pt[1] !== undefined ? pt[1] : pt.y;
            const z = pt[2] !== undefined ? pt[2] : pt.z;
            positions.push(x, y, z);
            allPositions.push(x, y, z);
          }

          const indices = [];
          for (let f = 0; f < faces.count; f++) {
            const face = faces.get(f);
            // face can be [a,b,c,d] array or object with A,B,C,D
            let a, b, c, d;
            if (Array.isArray(face)) {
              [a, b, c, d] = face;
            } else {
              a = face[0] !== undefined ? face[0] : 0;
              b = face[1] !== undefined ? face[1] : 0;
              c = face[2] !== undefined ? face[2] : 0;
              d = face[3] !== undefined ? face[3] : c;
            }
            indices.push(a, b, c);
            if (d !== c) indices.push(a, c, d); // quad → two triangles
          }

          if (positions.length === 0 || indices.length === 0) return;

          const geom = new THREE.BufferGeometry();
          geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
          geom.setIndex(indices);
          geom.computeVertexNormals();

          // Try to get object color
          let objMat = defaultMat;
          try {
            const attr = rhinoObj.attributes();
            const color = attr.drawColor(doc);
            if (color && (color.r + color.g + color.b > 0)) {
              objMat = new THREE.MeshPhongMaterial({
                color: new THREE.Color(color.r / 255, color.g / 255, color.b / 255),
                side: THREE.DoubleSide, flatShading: false,
              });
            }
          } catch(e) { /* use default material */ }

          const mesh3 = new THREE.Mesh(geom, objMat);
          mesh3.userData.layerIndex = rhinoObj.attributes().layerIndex;
          mesh3.visible = isVisible !== false;
          sceneRef.current.add(mesh3);
          sceneObjects.current.push({ threeObj: mesh3, layerIndex: mesh3.userData.layerIndex });
        } catch(e) { console.warn("addMeshToScene failed:", e); }
      }

      function addCurveToScene(geo, rhinoObj, isVisible) {
        const pts = [];
        try {
          // Try different curve approaches
          let curve = geo;
          if (geo.toNurbsCurve) {
            try { curve = geo.toNurbsCurve(); } catch(e) { curve = geo; }
          }

          // Try to get points via pointAt for smooth sampling
          if (curve.domain && typeof curve.pointAt === "function") {
            const domain = curve.domain;
            const steps = 50;
            for (let s = 0; s <= steps; s++) {
              const t = domain[0] + (domain[1] - domain[0]) * (s / steps);
              const pt = curve.pointAt(t);
              if (pt) {
                const x = pt[0] !== undefined ? pt[0] : pt.x;
                const y = pt[1] !== undefined ? pt[1] : pt.y;
                const z = pt[2] !== undefined ? pt[2] : pt.z;
                pts.push(new THREE.Vector3(x, y, z));
                allPositions.push(x, y, z);
              }
            }
          }

          // Fallback: control points
          if (pts.length < 2 && curve.points) {
            const cp = curve.points();
            for (let p = 0; p < cp.count; p++) {
              const pt = cp.get(p);
              const x = pt[0] !== undefined ? pt[0] : pt.x;
              const y = pt[1] !== undefined ? pt[1] : pt.y;
              const z = pt[2] !== undefined ? pt[2] : pt.z;
              pts.push(new THREE.Vector3(x, y, z));
              allPositions.push(x, y, z);
            }
          }
        } catch(e) { console.log("curve point extraction failed:", e); }

        if (pts.length > 1) {
          const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
          const line = new THREE.Line(lineGeo, lineMat);
          line.visible = isVisible !== false;
          if (rhinoObj) {
            line.userData.layerIndex = rhinoObj.attributes().layerIndex;
            sceneObjects.current.push({ threeObj: line, layerIndex: line.userData.layerIndex });
          }
          sceneRef.current.add(line);
        }
      }

      // Auto-fit camera to model
      if (allPositions.length > 0) {
        let minX = Infinity, minY = Infinity, minZ = Infinity;
        let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
        for (let i = 0; i < allPositions.length; i += 3) {
          minX = Math.min(minX, allPositions[i]); maxX = Math.max(maxX, allPositions[i]);
          minY = Math.min(minY, allPositions[i+1]); maxY = Math.max(maxY, allPositions[i+1]);
          minZ = Math.min(minZ, allPositions[i+2]); maxZ = Math.max(maxZ, allPositions[i+2]);
        }
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
        const size = Math.max(maxX - minX, maxY - minY, maxZ - minZ) || 10;

        // Center all objects
        sceneRef.current.traverse(child => { if (child.isMesh || child.isLine) child.position.set(-cx, -cy, -cz); });

        panOffset.current.set(0, 0, 0);
        zoomRef.current = Math.max(0.5, size / 40);
        updateCamera();
      }

      setModelInfo({ meshes: meshCount, curves: curveCount, objects: objects.count, skipped: skippedCount });
      setStatus(meshCount + curveCount > 0 ? "ready" : "error");
      if (meshCount + curveCount === 0) {
        setErrorMsg(`Filen lästes men inga synliga objekt hittades (${objects.count} objekt, ${skippedCount} överhoppade). Öppna webbkonsolen (F12) för detaljer.`);
      }
      doc.delete();
    } catch (e) {
      console.error("3D-laddningsfel:", e);
      setErrorMsg(e.message || "Okänt fel vid laddning");
      setStatus("error");
    }
  }

  const inputStyle = { padding: "9px 12px", borderRadius: 7, border: "1.5px solid #DDD5C8", background: "#FFFDF8", fontSize: 13, color: "#3A2E22", outline: "none", fontFamily: "inherit" };

  function toggleLayer(index) {
    setLayers(prev => {
      const updated = prev.map(l => l.index === index ? { ...l, visible: !l.visible } : l);
      const vis = updated.find(l => l.index === index)?.visible;
      sceneObjects.current.forEach(o => {
        if (o.layerIndex === index) o.threeObj.visible = vis;
      });
      return updated;
    });
  }

  return (
    <div>
      {/* URL input */}
      <div style={{ background: "#FFFDF8", borderRadius: 10, padding: 18, border: "1px solid #E5DDD0", marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#8A7D6B", letterSpacing: "0.06em", textTransform: "uppercase" }}>
            Ladda Rhino 3D-modell — GitHub raw eller Google Drive
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input
            placeholder="Klistra in GitHub raw-länk eller Google Drive-länk till .3dm-fil…"
            value={driveUrl}
            onChange={e => setDriveUrl(e.target.value)}
            onKeyDown={e => e.key === "Enter" && loadFromDrive()}
            style={{ ...inputStyle, flex: "1 1 300px" }}
          />
          <button
            onClick={loadFromDrive}
            disabled={!driveUrl.trim() || status === "loading"}
            style={{
              padding: "9px 20px", border: "none", borderRadius: 7,
              background: driveUrl.trim() && status !== "loading" ? "#5A7A8A" : "#E5DDD0",
              color: driveUrl.trim() && status !== "loading" ? "#fff" : "#A89878",
              fontWeight: 700, fontSize: 13, cursor: driveUrl.trim() ? "pointer" : "default",
            }}
          >
            {status === "loading" ? "Laddar…" : "Visa 3D-modell"}
          </button>
        </div>
        {!isProxyConfigured() && (
          <div style={{ marginTop: 8, padding: "8px 12px", background: "#FFF3E0", borderRadius: 6, fontSize: 11, color: "#8B5E3C", lineHeight: 1.4 }}>
            ⚠ CORS-proxy ej konfigurerad. Du behöver deploya en Cloudflare Worker och fylla i <code>CORS_PROXY_URL</code> i koden. Se filen <b>cloudflare-worker.js</b> för instruktioner.
          </div>
        )}
        {status === "error" && <div style={{ marginTop: 8, fontSize: 12, color: "#C75B4A", fontWeight: 600 }}>✗ {errorMsg}</div>}
        {modelInfo && (
          <div style={{ marginTop: 8, fontSize: 11, color: "#5B7F6E", fontWeight: 600 }}>
            ✓ Modell laddad — {modelInfo.meshes} ytor, {modelInfo.curves} kurvor ({modelInfo.objects} objekt totalt{modelInfo.skipped > 0 ? `, ${modelInfo.skipped} överhoppade` : ""})
          </div>
        )}
        <div style={{ marginTop: 6, fontSize: 10, color: "#A89878" }}>
          Vänster mus: rotera • Mittenknapp/högerklick: panorera • Scrolla: zooma • Stödjer .3dm-filer (Rhino 3D)
        </div>
      </div>

      {/* 3D viewport */}
      <div style={{ position: "relative", width: "100%", height: "calc(100vh - 220px)", minHeight: 400, borderRadius: 10, border: "1px solid #E5DDD0", overflow: "hidden", background: "#F5F0E6", cursor: "grab" }}>
        <div ref={containerRef} style={{ position: "absolute", inset: 0 }} />
        {status === "loading" && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(245,240,230,0.8)", zIndex: 10, pointerEvents: "none" }}>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 32, marginBottom: 8, animation: "pulse 1s infinite" }}>⛵</div>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#5A4A38" }}>Laddar 3D-modell…</div>
            </div>
          </div>
        )}
        {status === "idle" && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none" }}>
            <div style={{ textAlign: "center", color: "#A89878" }}>
              <div style={{ fontSize: 40, marginBottom: 8, opacity: 0.4 }}>◇</div>
              <div style={{ fontSize: 13, fontWeight: 500 }}>Klistra in en Google Drive-länk ovan för att visa en 3D-modell</div>
            </div>
          </div>
        )}
        {/* Layer panel */}
        {layers.length > 0 && (
          <div style={{
            position: "absolute", top: 10, right: 10, zIndex: 20,
            background: "rgba(255,253,248,0.92)", borderRadius: 8,
            border: "1px solid #E5DDD0", padding: "10px 12px",
            maxHeight: "calc(100% - 20px)", overflowY: "auto",
            minWidth: 160, backdropFilter: "blur(8px)",
            boxShadow: "0 2px 12px rgba(58,46,34,0.1)",
          }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: "#8A7D6B", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>Lager</div>
            {layers.map(l => (
              <div
                key={l.index}
                onClick={() => toggleLayer(l.index)}
                style={{
                  display: "flex", alignItems: "center", gap: 8, padding: "4px 6px",
                  borderRadius: 5, cursor: "pointer", fontSize: 12, fontWeight: 500,
                  color: l.visible ? "#3A2E22" : "#B0A898",
                  background: l.visible ? "transparent" : "rgba(0,0,0,0.03)",
                  transition: "all 0.15s",
                  marginBottom: 2,
                }}
                onMouseEnter={e => e.currentTarget.style.background = "rgba(0,0,0,0.05)"}
                onMouseLeave={e => e.currentTarget.style.background = l.visible ? "transparent" : "rgba(0,0,0,0.03)"}
              >
                <span style={{
                  width: 14, height: 14, borderRadius: 3, flexShrink: 0,
                  border: `2px solid ${l.visible ? l.color : "#CCC"}`,
                  background: l.visible ? l.color : "transparent",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  transition: "all 0.15s",
                }}>
                  {l.visible && <span style={{ color: "#fff", fontSize: 9, fontWeight: 800 }}>✓</span>}
                </span>
                <span style={{ textDecoration: l.visible ? "none" : "line-through", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.name}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Main App ───
const debouncedSave = createDebouncedSaver(1500);

function App() {
  const [tasks, setTasks] = useState(() => loadTasksLocal() || DEFAULT_TASKS);
  const [gallery, setGallery] = useState(() => loadGalleryLocal());
  const [view, setView] = useState("board");
  const [editingTask, setEditingTask] = useState(null);
  const [filterPhase, setFilterPhase] = useState("all");
  const [dragOverStatus, setDragOverStatus] = useState(null);
  const [draggingId, setDraggingId] = useState(null);
  const [lightbox, setLightbox] = useState(null); // { src, caption, images, currentIndex }

  function openLightbox(src, caption, images, currentIndex) {
    setLightbox({ src, caption, images: images || [], currentIndex: currentIndex ?? 0 });
  }
  function navigateLightbox(idx) {
    if (!lightbox?.images) return;
    const img = lightbox.images[idx];
    if (img) setLightbox({ ...lightbox, src: img.src, caption: img.caption, currentIndex: idx });
  }
  const [syncStatus, setSyncStatus] = useState(isJsonBinConfigured() ? "loading" : "offline");
  const [pending3dUrl, setPending3dUrl] = useState(null);
  const isInitialLoad = useRef(true);

  // On mount: load from cloud if configured
  useEffect(() => {
    if (!isJsonBinConfigured()) { setSyncStatus("offline"); return; }
    loadFromCloud().then(cloudData => {
      if (cloudData) {
        if (cloudData.tasks && cloudData.tasks.length > 0) {
          setTasks(cloudData.tasks);
          saveTasksLocal(cloudData.tasks);
        }
        if (cloudData.gallery) {
          setGallery(cloudData.gallery);
          saveGalleryLocal(cloudData.gallery);
        }
        setSyncStatus("saved");
      } else {
        // Cloud is empty, push local data up
        saveToCloud(tasks, gallery).then(ok => setSyncStatus(ok ? "saved" : "error"));
      }
      isInitialLoad.current = false;
    }).catch(() => { setSyncStatus("error"); isInitialLoad.current = false; });
  }, []);

  // Auto-save on changes (skip initial load)
  useEffect(() => {
    if (isInitialLoad.current) return;
    debouncedSave(tasks, gallery, setSyncStatus);
  }, [tasks, gallery]);

  const handleManualSync = async () => {
    setSyncStatus("loading");
    const cloudData = await loadFromCloud();
    if (cloudData) {
      if (cloudData.tasks && cloudData.tasks.length > 0) {
        setTasks(cloudData.tasks);
        saveTasksLocal(cloudData.tasks);
      }
      if (cloudData.gallery) {
        setGallery(cloudData.gallery);
        saveGalleryLocal(cloudData.gallery);
      }
      setSyncStatus("saved");
      showToast("All data synkad från molnet ✓");
    } else {
      setSyncStatus("error");
      showToast("Kunde inte hämta data ✗");
    }
  };

  const nextId = () => Math.max(0, ...tasks.map(t => t.id)) + 1;
  const handleDrop = (taskId, newStatus) => { setTasks(prev => prev.map(t => t.id === taskId ? { ...t, status: newStatus } : t)); setDraggingId(null); showToast("Status uppdaterad ✓"); };

  const handleReorder = (draggedId, targetId, statusId) => {
    setTasks(prev => {
      const columnTasks = prev.filter(t => t.status === statusId);
      const otherTasks = prev.filter(t => t.status !== statusId);
      const draggedIdx = columnTasks.findIndex(t => t.id === draggedId);
      const targetIdx = columnTasks.findIndex(t => t.id === targetId);
      if (draggedIdx === -1 || targetIdx === -1) return prev;
      const reordered = [...columnTasks];
      const [moved] = reordered.splice(draggedIdx, 1);
      reordered.splice(targetIdx, 0, moved);
      // Preserve overall order: put other tasks first, then reordered column
      return [...otherTasks.filter(t => prev.indexOf(t) < prev.findIndex(t2 => t2.status === statusId)), ...reordered, ...otherTasks.filter(t => prev.indexOf(t) > prev.findLastIndex(t2 => t2.status === statusId))];
    });
    showToast("Ordning uppdaterad ✓");
  };
  const handleSave = (form) => { if (form.id) { setTasks(prev => prev.map(t => t.id === form.id ? { ...form } : t)); } else { setTasks(prev => [...prev, { ...form, id: nextId() }]); } showToast(form.id ? "Uppgift sparad ✓" : "Uppgift tillagd ✓"); };
  const handleDelete = (id) => { setTasks(prev => prev.filter(t => t.id !== id)); showToast("Uppgift borttagen"); };
  const newTask = () => { setEditingTask({ id: 0, title: "", phase: "survey", status: "backlog", startWeek: 1, duration: 1, notes: "", files: [] }); };

  const handleReset = () => { if (confirm("Är du säker? Detta återställer alla uppgifter och bildarkivet till ursprungsläget och synkar till molnet.")) { setTasks(DEFAULT_TASKS); setGallery(DEFAULT_FOLDERS); showToast("Data återställd"); } };
  const handleExport = () => { const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = "renovering-marga-iii-backup.json"; a.click(); URL.revokeObjectURL(url); showToast("Backup exporterad ✓"); };
  const handleImport = () => { const input = document.createElement("input"); input.type = "file"; input.accept = ".json"; input.onchange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const imported = JSON.parse(ev.target.result); if (Array.isArray(imported) && imported.length > 0 && imported[0].title) { const cleaned = imported.map(t => ({ ...t, files: (t.files || []).map(f => ({ ...f, type: f.type || detectFileType(f.name || f.url) })) })); setTasks(cleaned); showToast(`${imported.length} uppgifter importerade ✓`); } else { showToast("Ogiltig fil ✗"); } } catch { showToast("Kunde inte läsa filen ✗"); } }; reader.readAsText(file); }; input.click(); };

  const filteredTasks = filterPhase === "all" ? tasks : tasks.filter(t => t.phase === filterPhase);

  return (
    <div style={{ minHeight: "100vh", background: "#F5F0E6" }}>
      <div style={{ background: "linear-gradient(135deg, #3A2E22 0%, #5A4A38 100%)", padding: "28px 32px 20px", color: "#FFFDF8" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 16 }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
              <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                <path d="M4 22C4 22 8 12 16 12C24 12 28 22 28 22" stroke="#D4A76A" strokeWidth="2.5" strokeLinecap="round" />
                <path d="M6 22H26" stroke="#D4A76A" strokeWidth="2" strokeLinecap="round" />
                <path d="M16 8V12" stroke="#D4A76A" strokeWidth="2" strokeLinecap="round" />
                <path d="M16 4L16 6" stroke="#D4A76A" strokeWidth="2" strokeLinecap="round" />
                <path d="M14 5L18 5" stroke="#D4A76A" strokeWidth="1.5" strokeLinecap="round" />
              </svg>
              <h1 style={{ margin: 0, fontFamily: "'Playfair Display', Georgia, serif", fontSize: 26, fontWeight: 700, letterSpacing: "-0.02em" }}>
                Renovering Marga III
              </h1>
            </div>
            <p style={{ margin: 0, fontSize: 13, color: "#C4B89E", fontWeight: 400 }}>Projektplanering</p>
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {view !== "gallery" && view !== "viewer3d" && <button onClick={newTask} style={{ padding: "10px 20px", background: "#5B7F6E", color: "#fff", border: "none", borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer", boxShadow: "0 2px 8px rgba(91,127,110,0.3)" }}>+ Ny uppgift</button>}
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 16, flexWrap: "wrap" }}>
          <div style={{ display: "flex", background: "rgba(255,253,248,0.12)", borderRadius: 8, overflow: "hidden" }}>
            {[{ id: "board", label: "Tavla" }, { id: "gantt", label: "Gantt-schema" }, { id: "gallery", label: "Bildarkiv" }, { id: "viewer3d", label: "3D-vy" }].map(v => (
              <button key={v.id} onClick={() => setView(v.id)} style={{ padding: "7px 18px", border: "none", background: view === v.id ? "rgba(255,253,248,0.22)" : "transparent", color: "#FFFDF8", fontWeight: view === v.id ? 700 : 400, fontSize: 13, cursor: "pointer", transition: "background 0.2s" }}>{v.label}</button>
            ))}
          </div>
          <select value={filterPhase} onChange={e => setFilterPhase(e.target.value)} style={{ padding: "7px 12px", border: "1px solid rgba(255,253,248,0.2)", borderRadius: 8, background: "rgba(255,253,248,0.08)", color: "#FFFDF8", fontSize: 13, cursor: "pointer", outline: "none", display: (view === "gallery" || view === "viewer3d") ? "none" : "block" }}>
            <option value="all" style={{ color: "#3A2E22" }}>Alla faser</option>
            {PHASES.map(p => <option key={p.id} value={p.id} style={{ color: "#3A2E22" }}>{p.label}</option>)}
          </select>
          <div style={{ marginLeft: "auto", display: "flex", gap: 6, alignItems: "center" }}>
            <SyncIndicator status={syncStatus} />
            {isJsonBinConfigured() && (
              <button onClick={handleManualSync} title="Hämta senaste data från molnet" style={{ padding: "6px 12px", border: "1px solid rgba(255,253,248,0.2)", borderRadius: 7, background: "transparent", color: "#C4B89E", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>⟳ Synka</button>
            )}
            <button onClick={handleExport} title="Exportera backup" style={{ padding: "6px 12px", border: "1px solid rgba(255,253,248,0.2)", borderRadius: 7, background: "transparent", color: "#C4B89E", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>↓ Backup</button>
            <button onClick={handleImport} title="Importera backup" style={{ padding: "6px 12px", border: "1px solid rgba(255,253,248,0.2)", borderRadius: 7, background: "transparent", color: "#C4B89E", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>↑ Importera</button>
          </div>
        </div>
      </div>

      <div style={{ padding: "24px 24px 40px", maxWidth: 1440, margin: "0 auto" }}>
        {(view !== "gallery" && view !== "viewer3d") && <Stats tasks={tasks} />}
        {view === "board" ? (
          <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 16 }}>
            {STATUSES.map(s => <KanbanColumn key={s.id} status={s} tasks={filteredTasks.filter(t => t.status === s.id)} phases={PHASES} onEdit={setEditingTask} onDrop={handleDrop} onDragStart={setDraggingId} dragOverStatus={dragOverStatus} setDragOverStatus={setDragOverStatus} onReorder={handleReorder} />)}
          </div>
        ) : view === "gantt" ? (
          <GanttChart tasks={tasks} phases={PHASES} onEdit={setEditingTask} filterPhase={filterPhase} />
        ) : view === "viewer3d" ? (
          <Rhino3DViewer pendingUrl={pending3dUrl} onPendingConsumed={() => setPending3dUrl(null)} />
        ) : (
          <ImageGallery
            onPreview={(src, caption, images, idx) => openLightbox(src, caption, images, idx)}
            folders={gallery} setFolders={setGallery}
            onOpen3dModel={url => { setView("viewer3d"); setPending3dUrl(url); }} />
        )}
        {(view !== "gallery" && view !== "viewer3d") && (
        <div style={{ marginTop: 24, display: "flex", flexWrap: "wrap", gap: 12, justifyContent: "center" }}>
          {PHASES.map(p => (
            <div key={p.id} onClick={() => setFilterPhase(filterPhase === p.id ? "all" : p.id)} style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", padding: "4px 10px", borderRadius: 6, background: filterPhase === p.id ? `${p.color}22` : "transparent", border: filterPhase === p.id ? `1.5px solid ${p.color}` : "1.5px solid transparent", transition: "all 0.2s" }}>
              <span style={{ width: 10, height: 10, borderRadius: "50%", background: p.color }} />
              <span style={{ fontSize: 12, fontWeight: 500, color: "#5A4A38" }}>{p.label}</span>
            </div>
          ))}
        </div>
        )}
        <div style={{ textAlign: "center", marginTop: 20, fontSize: 11, color: "#A89878" }}>
          {isJsonBinConfigured()
            ? "Data synkas automatiskt till molnet (JSONBin) • Alla med länken ser samma data"
            : "⚠ Molnsynk ej konfigurerad — data sparas bara lokalt. Fyll i JSONBIN_CONFIG i koden."}
        </div>
      </div>

      {editingTask && <TaskModal task={editingTask} phases={PHASES} onSave={handleSave} onDelete={handleDelete} onClose={() => setEditingTask(null)} onPreview={(src, caption) => setLightbox({ src, caption })} />}
      {lightbox && <Lightbox src={lightbox.src} caption={lightbox.caption} images={lightbox.images} currentIndex={lightbox.currentIndex} onClose={() => setLightbox(null)} onNavigate={navigateLightbox} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
