function detectFileType(nameOrUrl) {
  const str = (nameOrUrl || "").toLowerCase();
  const ext = str.split(".").pop().split("?")[0].split("#")[0];
  for (const [key, def] of Object.entries(FILE_TYPES)) {
    if (def.extensions.includes(ext)) return key;
  }
  if (str.includes("drive.google.com")) return "image";
  return "other";
}

function getFileTypeDef(type) {
  return FILE_TYPES[type] || FILE_TYPES.other;
}

// ─── Helpers ───
function getWeekLabel(week) {
  const d = new Date(2026, 2, 2);
  d.setDate(d.getDate() + (week - 1) * 7);
  return d.toLocaleDateString("sv-SE", { day: "numeric", month: "short" });
}

function loadTasksLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return parsed.map(t => ({ ...t, files: (t.files || []).map(f => ({ ...f, type: f.type || detectFileType(f.name || f.url) })) }));
    }
  } catch (e) { console.warn("Kunde inte ladda sparad data:", e); }
  return null;
}

function saveTasksLocal(tasks) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
  catch (e) { console.warn("Kunde inte spara lokalt:", e); }
}

// ─── JSONBin Cloud Sync (combined: tasks + gallery) ───
function normalizeTasks(arr) {
  if (!Array.isArray(arr)) return null;
  return arr.map(t => ({ ...t, files: (t.files || []).map(f => ({ ...f, type: f.type || detectFileType(f.name || f.url) })) }));
}

async function loadFromCloud() {
  if (!isJsonBinConfigured()) return null;
  try {
    const res = await fetch(`${JSONBIN_CONFIG.BASE_URL}/b/${JSONBIN_CONFIG.BIN_ID}/latest`, {
      headers: { "X-Master-Key": JSONBIN_CONFIG.API_KEY }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const record = data.record;
    // Support both old format (plain array) and new format ({ tasks, gallery })
    if (Array.isArray(record)) {
      return { tasks: normalizeTasks(record), gallery: null };
    }
    if (record && record.tasks) {
      return { tasks: normalizeTasks(record.tasks), gallery: record.gallery || null };
    }
    return null;
  } catch (e) { console.warn("Kunde inte hämta från JSONBin:", e); return null; }
}

async function saveToCloud(tasks, gallery) {
  if (!isJsonBinConfigured()) return false;
  try {
    const res = await fetch(`${JSONBIN_CONFIG.BASE_URL}/b/${JSONBIN_CONFIG.BIN_ID}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_CONFIG.API_KEY },
      body: JSON.stringify({ tasks, gallery }),
    });
    return res.ok;
  } catch (e) { console.warn("Kunde inte spara till JSONBin:", e); return false; }
}

// Debounce helper for combined save
function createDebouncedSaver(delayMs = 1500) {
  let timer = null;
  return function debouncedSave(tasks, gallery, onStatus) {
    if (timer) clearTimeout(timer);
    onStatus("saving");
    saveTasksLocal(tasks);
    saveGalleryLocal(gallery);
    if (!isJsonBinConfigured()) { onStatus("offline"); return; }
    timer = setTimeout(async () => {
      const ok = await saveToCloud(tasks, gallery);
      onStatus(ok ? "saved" : "error");
    }, delayMs);
  };
}

function setGithubReadToken(t) { if (t) localStorage.setItem(GITHUB_TOKEN_KEY, t); else localStorage.removeItem(GITHUB_TOKEN_KEY); }

function ghApiHeaders() {

  const saved = sessionStorage.getItem(UPLOAD_SESSION_KEY);

const IMAGE_EXTS = ["jpg","jpeg","png","gif","webp","svg","bmp","tiff"];
const DOC_EXTS   = ["pdf","dwg","dxf","step","stp","stl","3dm","doc","docx","xls","xlsx","txt"];

function isImageFile(name) { const ext = name.split(".").pop().toLowerCase(); return IMAGE_EXTS.includes(ext); }
function isDocFile(name)   { const ext = name.split(".").pop().toLowerCase(); return DOC_EXTS.includes(ext); }

// ─── URL helpers — stödjer GitHub raw och Google Drive ───
function isGithubUrl(url) {
  return url && (url.includes("raw.githubusercontent.com") || url.includes("github.com"));
}

function isGdriveUrl(url) {
  return url && (url.includes("drive.google.com") || url.includes("docs.google.com"));
}

function extractGdriveId(url) {
  const patterns = [/\/file\/d\/([a-zA-Z0-9_-]+)/, /id=([a-zA-Z0-9_-]+)/, /\/d\/([a-zA-Z0-9_-]+)/];
  for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
  return null;
}

// Konvertera github.com blob-URL till raw
function toGithubRaw(url) {
  return url
    .replace("github.com", "raw.githubusercontent.com")
    .replace("/blob/", "/");
}

// Thumbnail/förhandsgransknings-URL för bilder
function fileThumbUrl(url) {
  if (!url) return url;
  if (isGdriveUrl(url)) {
    const id = extractGdriveId(url);
    return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w400` : url;
  }
  if (isGithubUrl(url)) return toGithubRaw(url);
  return url;
}

// Stor bild för lightbox
function fileViewUrl(url) {
  if (!url) return url;
  if (isGdriveUrl(url)) {
    const id = extractGdriveId(url);
    return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1600` : url;
  }
  if (isGithubUrl(url)) return toGithubRaw(url);
  return url;
}

// Nedladdnings-URL
function fileDownloadUrl(url) {
  if (!url) return url;
  if (isGdriveUrl(url)) {
    const id = extractGdriveId(url);
    return id ? `https://drive.google.com/uc?export=download&id=${id}` : url;
  }
  if (isGithubUrl(url)) return toGithubRaw(url);
  return url;
}

// Öppna i webbläsare
function fileOpenUrl(url) {
  if (!url) return url;
  if (isGdriveUrl(url)) {
    const id = extractGdriveId(url);
    return id ? `https://drive.google.com/file/d/${id}/view` : url;
  }
  return url; // GitHub och övriga öppnas direkt
}

// ─── Lightbox ───
function Lightbox({ src, caption, onClose, images, currentIndex, onNavigate }) {
  // images = [{src, caption}], currentIndex = number
  const hasNav = images && images.length > 1;
  const hasPrev = hasNav && currentIndex > 0;
  const hasNext = hasNav && currentIndex < images.length - 1;

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      if (e.key === "ArrowLeft" && hasPrev) onNavigate(currentIndex - 1);
      if (e.key === "ArrowRight" && hasNext) onNavigate(currentIndex + 1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [currentIndex, hasPrev, hasNext]);

  if (!src) return null;

  const btnStyle = (enabled) => ({
    position: "fixed", top: "50%", transform: "translateY(-50%)",
    background: enabled ? "rgba(58,46,34,0.7)" : "rgba(58,46,34,0.2)",
    border: "none", borderRadius: "50%", width: 44, height: 44,
    color: enabled ? "#FFFDF8" : "rgba(255,253,248,0.3)",
    fontSize: 20, cursor: enabled ? "pointer" : "default",
    display: "flex", alignItems: "center", justifyContent: "center",
    zIndex: 3001, transition: "background 0.15s",
  });

  return (
    <div className="lightbox" onClick={onClose}>
      <img src={src} alt={caption || "Bild"} onClick={e => e.stopPropagation()} />
      {caption && <div className="lightbox-caption">{hasNav ? `${currentIndex + 1} / ${images.length} — ${caption}` : caption}</div>}
      {hasPrev && (
        <button style={{ ...btnStyle(true), left: 16 }} onClick={e => { e.stopPropagation(); onNavigate(currentIndex - 1); }}>‹</button>
      )}
      {hasNext && (
        <button style={{ ...btnStyle(true), right: 16 }} onClick={e => { e.stopPropagation(); onNavigate(currentIndex + 1); }}>›</button>
      )}
    </div>
  );
}

// ─── File Card (single file row) ───
function FileCard({ file, index, onRemove, onPreview }) {
  const typeDef = getFileTypeDef(file.type || detectFileType(file.name || file.url));
  const isImage = (file.type || detectFileType(file.name || file.url)) === "image";
  const driveId = extractGdriveId(file.url);

  return (
    <div className="file-card">
      {/* Icon or thumbnail */}
      {isImage && driveId ? (
        <img
          src={fileThumbUrl(file.url)}
          alt={file.name}
          style={{ width: 40, height: 40, borderRadius: 6, objectFit: "cover", cursor: "pointer", flexShrink: 0, border: "1px solid #E5DDD0" }}
          onClick={() => onPreview(fileViewUrl(file.url), file.name)}
          onError={e => { e.target.style.display = "none"; e.target.nextSibling && (e.target.nextSibling.style.display = "flex"); }}
        />
      ) : null}
      <div className="file-icon" style={{ background: typeDef.color, display: (isImage && driveId) ? "none" : "flex" }}>
        {typeDef.icon}
      </div>

      {/* Name & meta */}
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: "#3A2E22", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{file.name}</div>
        <div style={{ fontSize: 10, color: "#A89878" }}>{typeDef.label} • {file.addedAt ? new Date(file.addedAt).toLocaleDateString("sv-SE") : ""}</div>
      </div>

      {/* Actions */}
      <div className="file-actions" style={{ display: "flex", gap: 2, flexShrink: 0 }}>
        {isImage && (
          <button onClick={() => onPreview(fileViewUrl(file.url), file.name)} title="Förhandsgranska" style={{ color: "#5B7F6E" }}>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3" stroke="currentColor" strokeWidth="1.5"/><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" strokeWidth="1.5"/></svg>
          </button>
        )}
        <a href={fileOpenUrl(file.url)} target="_blank" rel="noopener noreferrer" title="Öppna fil" style={{ color: "#5A7A8A" }}>
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M11 3h6v6M17 3L9 11M7 5H4a1 1 0 00-1 1v10a1 1 0 001 1h10a1 1 0 001-1v-3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </a>
        <a href={fileDownloadUrl(file.url)} target="_blank" rel="noopener noreferrer" title="Ladda ner" style={{ color: "#6E7F8D" }}>
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 3v10m0 0l-3.5-3.5M10 13l3.5-3.5M3 16h14" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </a>

// ─── File Attachments Section ───
function FileAttachments({ files, onChange, onPreview }) {
  const [newUrl, setNewUrl] = useState("");
  const [newName, setNewName] = useState("");
  const [newType, setNewType] = useState("auto");

  const addFile = () => {
    if (!newUrl.trim()) return;
    const autoType = detectFileType(newName.trim() || newUrl.trim());
    const type = newType === "auto" ? autoType : newType;
    const name = newName.trim() || `Fil ${files.length + 1}`;
    onChange([...files, { url: newUrl.trim(), name, type, addedAt: new Date().toISOString() }]);
    setNewUrl("");
    setNewName("");
    setNewType("auto");
    showToast("Fil tillagd ✓");
  };

  const removeFile = (idx) => onChange(files.filter((_, i) => i !== idx));

  return (
    <div style={{ marginTop: 14 }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#8A7D6B", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10.5 2.5l-6 6a4.24 4.24 0 006 6l6.5-6.5a2.83 2.83 0 00-4-4L6.5 10.5a1.41 1.41 0 002 2L14 7" stroke="#8A7D6B" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        Bifogade filer ({files.length})

      {/* File list */}
      {files.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 12 }}>
          {files.map((f, i) => (
            <FileCard key={i} file={f} index={i} onRemove={removeFile} onPreview={onPreview} />
          ))}
          {/* Download all */}
          {files.length > 1 && (
            <div style={{ textAlign: "right", marginTop: 2 }}>
              <button
                onClick={() => { files.forEach((f, i) => { setTimeout(() => { window.open(fileDownloadUrl(f.url), "_blank"); }, i * 500); }); showToast("Laddar ner alla filer…"); }}
                style={{ fontSize: 11, fontWeight: 700, color: "#5A7A8A", background: "none", border: "1.5px solid #5A7A8A", borderRadius: 6, padding: "5px 12px", cursor: "pointer", transition: "background 0.15s" }}

                onMouseLeave={e => e.currentTarget.style.background = "transparent"}

                ↓ Ladda ner alla ({files.length} filer)

            </div>
          )}

      {/* Add new file */}
      <div style={{ background: "#FAF6EF", border: "1.5px dashed #DDD5C8", borderRadius: 8, padding: 12 }}>
        <div style={{ fontSize: 11, fontWeight: 600, color: "#6B5D4E", marginBottom: 8 }}>Lägg till fil från Google Drive</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          <input
            placeholder="Klistra in Google Drive-länk…"
            value={newUrl}
            onChange={e => setNewUrl(e.target.value)}
            onKeyDown={e => e.key === "Enter" && addFile()}
            style={{ flex: "2 1 180px", padding: "7px 10px", borderRadius: 7, border: "1.5px solid #DDD5C8", background: "#FFFDF8", fontSize: 12, color: "#3A2E22", outline: "none", fontFamily: "inherit" }}
          />
          <input
            placeholder="Filnamn (t.ex. skrov-foto.jpg)"
            value={newName}
            onChange={e => setNewName(e.target.value)}
            onKeyDown={e => e.key === "Enter" && addFile()}
            style={{ flex: "1 1 140px", padding: "7px 10px", borderRadius: 7, border: "1.5px solid #DDD5C8", background: "#FFFDF8", fontSize: 12, color: "#3A2E22", outline: "none", fontFamily: "inherit" }}
          />
          <select
            value={newType}
            onChange={e => setNewType(e.target.value)}
            style={{ flex: "0 0 90px", padding: "7px 6px", borderRadius: 7, border: "1.5px solid #DDD5C8", background: "#FFFDF8", fontSize: 12, color: "#3A2E22", outline: "none", fontFamily: "inherit", cursor: "pointer" }}
          >
            <option value="auto">Auto</option>
            <option value="image">Bild</option>
            <option value="pdf">PDF</option>
            <option value="cad">CAD</option>
            <option value="doc">Dokument</option>
            <option value="other">Övrigt</option>

            onClick={addFile}

// ─── Kanban Card ───
function KanbanCard({ task, phases, onEdit, onDragStart, onDragOver, onDrop }) {

  const files = task.files || [];

  return (
    <div
      draggable
      onDragStart={e => { e.dataTransfer.setData("taskId", String(task.id)); onDragStart(task.id); }}
      onDragOver={e => { e.preventDefault(); e.stopPropagation(); if (onDragOver) onDragOver(task.id); }}
      onDrop={e => { e.preventDefault(); e.stopPropagation(); if (onDrop) onDrop(e); }}
      onClick={() => onEdit(task)}

// ─── Gantt Chart ───
function GanttChart({ tasks, phases, onEdit, filterPhase }) {
  const filtered = filterPhase === "all" ? tasks : tasks.filter(t => t.phase === filterPhase);
  const sorted = [...filtered].sort((a, b) => a.startWeek - b.startWeek || a.phase.localeCompare(b.phase));
  const weekWidth = 46, rowHeight = 34, labelWidth = 250;
  const today = new Date(), projectStart = new Date(2026, 2, 2);
  const diffDays = Math.max(0, (today - projectStart) / (1000 * 60 * 60 * 24));
  const currentWeek = Math.min(TOTAL_WEEKS, 1 + diffDays / 7);

  return (
    <div style={{ overflow: "auto", borderRadius: 10, border: "1px solid #E5DDD0" }}>
      <div style={{ display: "flex", minWidth: labelWidth + TOTAL_WEEKS * weekWidth }}>
        <div style={{ width: labelWidth, flexShrink: 0, borderRight: "1px solid #E5DDD0", background: "#FAF6EF" }}>
          <div style={{ height: 36, borderBottom: "1px solid #E5DDD0", padding: "8px 12px", fontSize: 11, fontWeight: 700, color: "#8A7D6B", textTransform: "uppercase", letterSpacing: "0.06em" }}>Uppgift</div>
          {sorted.map(t => {
            const phase = phases.find(p => p.id === t.phase);
            return (
              <div key={t.id} onClick={() => onEdit(t)} style={{ height: rowHeight, display: "flex", alignItems: "center", padding: "0 12px", fontSize: 12, fontWeight: 500, color: "#3A2E22", borderBottom: "1px solid #F0EBE2", cursor: "pointer", gap: 6, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: phase?.color, flexShrink: 0 }} />
                <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{t.title}</span>
                {(t.files||[]).length > 0 && <span style={{ fontSize: 9, color: "#A89878", flexShrink: 0 }}>📎{(t.files||[]).length}</span>}
              </div>
            );
          })}
        </div>
        <div style={{ flex: 1, position: "relative" }}>
          <div style={{ display: "flex", borderBottom: "1px solid #E5DDD0", height: 36 }}>
            {Array.from({ length: TOTAL_WEEKS }, (_, i) => (
              <div key={i} style={{ width: weekWidth, flexShrink: 0, textAlign: "center", fontSize: 10, color: "#8A7D6B", padding: "4px 0", borderRight: "1px solid #F0EBE2", lineHeight: 1.2, display: "flex", flexDirection: "column", justifyContent: "center" }}>
                <div style={{ fontWeight: 700 }}>V{i + 1}</div>
                <div>{getWeekLabel(i + 1)}</div>
              </div>
            ))}
          </div>
          <div style={{ position: "relative" }}>
            <div style={{ position: "absolute", left: (currentWeek - 1) * weekWidth + weekWidth / 2 - 1, top: 0, bottom: 0, width: 2, background: "#C75B4A", opacity: 0.5, zIndex: 5, pointerEvents: "none" }} />
            {sorted.map(t => {
              const phase = phases.find(p => p.id === t.phase);
              const left = (t.startWeek - 1) * weekWidth, width = t.duration * weekWidth - 4;
              const isDone = t.status === "done", isInProgress = t.status === "in_progress";
              return (
                <div key={t.id} style={{ height: rowHeight, position: "relative", borderBottom: "1px solid #F0EBE2" }}>
                  {Array.from({ length: TOTAL_WEEKS }, (_, i) => <div key={i} style={{ position: "absolute", left: i * weekWidth, top: 0, bottom: 0, width: 1, background: "#F0EBE2" }} />)}
                  <div onClick={() => onEdit(t)} style={{ position: "absolute", left: left + 2, top: 6, width: Math.max(width, 16), height: rowHeight - 12, background: isDone ? `repeating-linear-gradient(135deg, ${phase?.color}CC, ${phase?.color}CC 4px, ${phase?.color}99 4px, ${phase?.color}99 8px)` : isInProgress ? `linear-gradient(90deg, ${phase?.color}, ${phase?.color}BB)` : `${phase?.color}55`, borderRadius: 5, cursor: "pointer", border: `1.5px solid ${phase?.color}`, transition: "transform 0.12s", display: "flex", alignItems: "center", paddingLeft: 6, overflow: "hidden" }} onMouseEnter={e => e.currentTarget.style.transform = "scaleY(1.15)"} onMouseLeave={e => e.currentTarget.style.transform = "scaleY(1)"}>
                    {width > 50 && <span style={{ fontSize: 10, fontWeight: 600, color: isDone || isInProgress ? "#fff" : "#3A2E22", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", textShadow: isDone || isInProgress ? "0 1px 2px rgba(0,0,0,0.2)" : "none" }}>{t.title}</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Stats ───

  const total = tasks.length;
  const done = tasks.filter(t => t.status === "done").length;
  const inProgress = tasks.filter(t => t.status === "in_progress").length;
  const totalFiles = tasks.reduce((sum, t) => sum + (t.files || []).length, 0);
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

    { label: "Pågående", value: inProgress, color: "#D4A76A" },

    <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 20 }}>

  );
}

// ─── PDF Thumbnail (renders first page via PDF.js) ───
function PdfThumbnail({ url, onClick }) {
  const canvasRef = useRef(null);
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    if (!window.pdfjsLib) { setFailed(true); return; }
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    let cancelled = false;
    window.pdfjsLib.getDocument({ url, withCredentials: false }).promise.then(pdf => {
      if (cancelled) return;
      return pdf.getPage(1);
    }).then(page => {
      if (cancelled || !canvasRef.current) return;
      const viewport = page.getViewport({ scale: 1 });
      const scale = 170 / viewport.width;
      const scaled = page.getViewport({ scale });
      const canvas = canvasRef.current;
      canvas.width = scaled.width;
      canvas.height = scaled.height;
      page.render({ canvasContext: canvas.getContext("2d"), viewport: scaled });
    }).catch(() => { if (!cancelled) setFailed(true); });
    return () => { cancelled = true; };
  }, [url]);

  if (failed) return (
    <div style={{ width: "100%", height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4 }}>
      <span style={{ fontSize: 32 }}>📄</span>
      <span style={{ fontSize: 11, fontWeight: 700, color: "#8A7D6B", background: "#E5DDD0", padding: "2px 6px", borderRadius: 4 }}>PDF</span>
    </div>
  );

  return (
    <canvas ref={canvasRef} onClick={onClick}
      style={{ width: "100%", height: "100%", objectFit: "cover", cursor: "zoom-in", display: "block" }} />
  );
}

// ─── PDF Page Canvas (renders one page) ───
function PdfPageCanvas({ pdf, pageNum, scale }) {
  const canvasRef = useRef(null);
  const renderTask = useRef(null);

  useEffect(() => {
    if (!pdf || !canvasRef.current) return;
    let cancelled = false;
    pdf.getPage(pageNum).then(page => {
      if (cancelled) return;
      const vp = page.getViewport({ scale });
      const canvas = canvasRef.current;
      if (!canvas) return;
      canvas.width = vp.width;
      canvas.height = vp.height;
      if (renderTask.current) { renderTask.current.cancel(); }
      renderTask.current = page.render({ canvasContext: canvas.getContext("2d"), viewport: vp });
      renderTask.current.promise.catch(() => {});
    });
    return () => { cancelled = true; if (renderTask.current) renderTask.current.cancel(); };
  }, [pdf, pageNum, scale]);

  return (
    <canvas ref={canvasRef} style={{ display: "block", borderRadius: 3, boxShadow: "0 2px 10px rgba(0,0,0,0.25)", margin: "0 auto" }} />
  );
}

  const [scale, setScale] = useState(1.4);

  useEffect(() => {
    if (!window.pdfjsLib) { setError("PDF.js ej tillgänglig"); setLoading(false); return; }
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    let cancelled = false;
    window.pdfjsLib.getDocument({ url, withCredentials: false }).promise
      .then(doc => {
        if (cancelled) return;
        setPdf(doc);
        setNumPages(doc.numPages);
        setLoading(false);
      })
      .catch(e => { if (!cancelled) { setError(e.message); setLoading(false); } });
    return () => { cancelled = true; };
  }, [url]);

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(20,15,10,0.88)", zIndex: 9999, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-start", overflowY: "auto" }}>
      {/* Sticky header */}
      <div onClick={e => e.stopPropagation()} style={{ position: "sticky", top: 0, zIndex: 10, width: "min(860px, 95vw)", background: "#FAF6EF", borderRadius: "0 0 10px 10px", borderBottom: "1px solid #E5DDD0", padding: "10px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", boxShadow: "0 2px 12px rgba(0,0,0,0.3)" }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#3A2E22", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: "40%" }}>📄 {name}</div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexShrink: 0 }}>
          {numPages > 0 && <span style={{ fontSize: 11, color: "#8A7D6B" }}>{numPages} sidor</span>}
          <button onClick={() => setScale(s => Math.max(0.5, +(s - 0.2).toFixed(1)))} style={{ padding: "3px 9px", border: "1px solid #DDD5C8", borderRadius: 5, background: "#fff", cursor: "pointer", fontSize: 15, color: "#5A4A38", lineHeight: 1 }}>−</button>
          <span style={{ fontSize: 11, color: "#8A7D6B", minWidth: 38, textAlign: "center" }}>{Math.round(scale * 100)}%</span>
          <button onClick={() => setScale(s => Math.min(3, +(s + 0.2).toFixed(1)))} style={{ padding: "3px 9px", border: "1px solid #DDD5C8", borderRadius: 5, background: "#fff", cursor: "pointer", fontSize: 15, color: "#5A4A38", lineHeight: 1 }}>+</button>
          <a href={url} target="_blank" rel="noreferrer" onClick={e => e.stopPropagation()}
            style={{ padding: "5px 12px", background: "#5B7F6E", color: "#fff", borderRadius: 6, fontSize: 11, fontWeight: 700, textDecoration: "none" }}>↓ Ladda ner</a>
          <button onClick={onClose} style={{ padding: "5px 10px", background: "none", border: "1px solid #DDD5C8", borderRadius: 6, fontSize: 13, cursor: "pointer", color: "#6B5D4E" }}>✕</button>
        </div>
      </div>

      {/* Pages */}
      <div onClick={e => e.stopPropagation()} style={{ width: "min(860px, 95vw)", padding: "16px 0 40px", display: "flex", flexDirection: "column", gap: 12, overflowX: "auto" }}>
        {loading && <div style={{ padding: 60, color: "#C4B89E", fontSize: 13, textAlign: "center" }}>Laddar PDF…</div>}
        {error && <div style={{ padding: 20, color: "#C75B4A", fontSize: 13, textAlign: "center" }}>⚠ {error}</div>}
        {pdf && Array.from({ length: numPages }, (_, i) => (
          <PdfPageCanvas key={`${url}-${i}-${scale}`} pdf={pdf} pageNum={i + 1} scale={scale} />
        ))}
      </div>
    </div>
  );
}

// ─── GitHub Uploader — hardcoded accounts ───
// XOR-obfuskering: inte kryptografi men hindrar tokens från att synas i klartext
function xorObfuscate(str, key = "marga1918") {
  return Array.from(str).map((c, i) =>
    String.fromCharCode(c.charCodeAt(0) ^ key.charCodeAt(i % key.length))
  ).join("");
}
function encodeToken(tok) { return btoa(xorObfuscate(tok)); }
function decodeToken(enc) { return xorObfuscate(atob(enc), "marga1918"); }

// ╔══════════════════════════════════════════════════════════╗
// ║  KONTON — byt ut TOKEN_ENC mot encodeToken("ghp_xxx")  ║
// ║  Kör encodeToken("ghp_ditt_token") i webbkonsolen       ║
// ║  och klistra in resultatet som TOKEN_ENC nedan          ║
// ╚══════════════════════════════════════════════════════════╝
const UPLOAD_ACCOUNTS = [
  { id: "konto1", name: "Mats",    password: "marga1",  tokenEnc: "" },
  { id: "konto2", name: "Konto 2", password: "marga2",  tokenEnc: "" },
  { id: "konto3", name: "Konto 3", password: "marga3",  tokenEnc: "" },
  { id: "konto4", name: "Konto 4", password: "marga4",  tokenEnc: "" },
];

const UPLOAD_SESSION_KEY = "marga_upload_account";

function GithubUploader({ targetPath, onDone }) {
  const [loggedIn, setLoggedIn] = useState(() => {
    const saved = sessionStorage.getItem(UPLOAD_SESSION_KEY);
    return saved ? JSON.parse(saved) : null;
  });
  const [selectedId, setSelectedId] = useState(UPLOAD_ACCOUNTS[0].id);
  const [password, setPassword] = useState("");
  const [loginError, setLoginError] = useState("");
  const [file, setFile] = useState(null);
  const [status, setStatus] = useState("idle");
  const [msg, setMsg] = useState("");
  const [dragging, setDragging] = useState(false);

  const inputStyle = { padding: "7px 10px", borderRadius: 6, border: "1.5px solid #DDD5C8", background: "#FFFDF8", fontSize: 12, color: "#3A2E22", outline: "none", fontFamily: "inherit" };

  function login() {
    const account = UPLOAD_ACCOUNTS.find(a => a.id === selectedId);
    if (!account) return;
    if (account.password !== password) { setLoginError("Fel lösenord"); return; }
    if (!account.tokenEnc) { setLoginError("Token ej konfigurerat för detta konto — kontakta admin"); return; }
    const session = { id: account.id, name: account.name };
    sessionStorage.setItem(UPLOAD_SESSION_KEY, JSON.stringify(session));
    setLoggedIn(session);
    setPassword("");
    setLoginError("");
  }

  function logout() {
    sessionStorage.removeItem(UPLOAD_SESSION_KEY);
    setLoggedIn(null);
    setFile(null);
    setStatus("idle");
    setMsg("");
  }

  function getToken() {
    const account = UPLOAD_ACCOUNTS.find(a => a.id === loggedIn?.id);
    return account ? decodeToken(account.tokenEnc) : null;
  }

  async function upload(uploadFile) {
    const f = uploadFile || file;
    if (!f) return;
    const token = getToken();
    if (!token) return;
    setStatus("uploading");
    setMsg("");
    try {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(",")[1];
        const path = `${targetPath}/${f.name}`;
        let sha;
        const check = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`, {
          headers: { Authorization: `token ${token}`, Accept: "application/vnd.github.v3+json" }
        });
        if (check.ok) { sha = (await check.json()).sha; }
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`, {
          method: "PUT",
          headers: { Authorization: `token ${token}`, "Content-Type": "application/json", Accept: "application/vnd.github.v3+json" },
          body: JSON.stringify({ message: `${loggedIn.name}: laddar upp ${f.name}`, content: base64, ...(sha ? { sha } : {}) }),
        });
        if (!res.ok) {
          const err = await res.json();
          if (res.status === 401) { logout(); setStatus("error"); setMsg("Session utgången — logga in igen"); return; }
          throw new Error(err.message || `HTTP ${res.status}`);
        }
        setStatus("done");
        setMsg(`✓ ${f.name} uppladdad!`);
        setFile(null);
        if (onDone) setTimeout(onDone, 800);
      };
      reader.readAsDataURL(f);
    } catch(e) { setStatus("error"); setMsg(`✗ ${e.message}`); }
  }

  function onDrop(e) {
    e.preventDefault();
    setDragging(false);
    const dropped = e.dataTransfer.files[0];
    if (dropped) { setFile(dropped); setStatus("idle"); setMsg(""); }
  }

  // Login form
  if (!loggedIn) return (
    <div style={{ background: "#FAF6EF", border: "1.5px dashed #DDD5C8", borderRadius: 10, padding: 16, marginTop: 16 }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#8A7D6B", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 12 }}>🔒 Logga in för att ladda upp</div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <select value={selectedId} onChange={e => { setSelectedId(e.target.value); setLoginError(""); }}
          style={{ ...inputStyle, cursor: "pointer" }}>
          {UPLOAD_ACCOUNTS.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
        </select>
        <input type="password" placeholder="Lösenord…" value={password}
          onChange={e => { setPassword(e.target.value); setLoginError(""); }}
          onKeyDown={e => e.key === "Enter" && login()}
          style={{ ...inputStyle, width: 130 }} />
        <button onClick={login} disabled={!password} style={{ padding: "7px 14px", background: password ? "#5B7F6E" : "#E5DDD0", color: password ? "#fff" : "#A89878", border: "none", borderRadius: 6, fontWeight: 700, fontSize: 12, cursor: password ? "pointer" : "default" }}>Logga in</button>
      </div>
      {loginError && <div style={{ fontSize: 11, color: "#C75B4A", marginTop: 6, fontWeight: 600 }}>{loginError}</div>}
    </div>
  );

  // Upload form (logged in)
  return (
    <div style={{ marginTop: 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#5B7F6E", textTransform: "uppercase", letterSpacing: "0.06em" }}>↑ Ladda upp — inloggad som {loggedIn.name}</div>
        <button onClick={logout} style={{ fontSize: 10, color: "#A89878", background: "none", border: "none", cursor: "pointer" }}>Logga ut</button>
      </div>

      {/* Drop zone */}
      <div
        onDragOver={e => { e.preventDefault(); setDragging(true); }}
        onDragLeave={() => setDragging(false)}
        onDrop={onDrop}
        onClick={() => document.getElementById(`file-input-${targetPath.replace(/\//g,"-")}`)?.click()}
        style={{
          border: `2px dashed ${dragging ? "#5B7F6E" : file ? "#5B7F6E" : "#C4B89E"}`,
          borderRadius: 10, padding: "20px 16px", textAlign: "center", cursor: "pointer",
          background: dragging ? "rgba(91,127,110,0.06)" : file ? "rgba(91,127,110,0.04)" : "#FAF6EF",
          transition: "all 0.15s",
        }}>
        <input id={`file-input-${targetPath.replace(/\//g,"-")}`} type="file" style={{ display: "none" }}
          onChange={e => { const f = e.target.files[0]; if (f) { setFile(f); setStatus("idle"); setMsg(""); } }} />
        {file ? (
          <div>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#3A2E22" }}>📎 {file.name}</div>
            <div style={{ fontSize: 11, color: "#8A7D6B", marginTop: 2 }}>{(file.size / 1024).toFixed(0)} KB</div>
          </div>
        ) : (
          <div>
            <div style={{ fontSize: 24, marginBottom: 4 }}>↑</div>
            <div style={{ fontSize: 12, color: "#8A7D6B" }}>Dra och släpp en fil hit, eller klicka för att välja</div>
          </div>
        )}
      </div>

      {file && (
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <button onClick={() => upload()} disabled={status === "uploading"}
            style={{ flex: 1, padding: "8px 0", background: status === "uploading" ? "#E5DDD0" : "#5B7F6E", color: status === "uploading" ? "#A89878" : "#fff", border: "none", borderRadius: 7, fontWeight: 700, fontSize: 12, cursor: status === "uploading" ? "default" : "pointer" }}>
            {status === "uploading" ? "Laddar upp…" : `↑ Ladda upp till ${targetPath.split("/").pop()}`}
          </button>
          <button onClick={() => { setFile(null); setStatus("idle"); setMsg(""); }}
            style={{ padding: "8px 12px", background: "none", border: "1px solid #DDD5C8", borderRadius: 7, cursor: "pointer", color: "#8A7D6B", fontSize: 12 }}>✕</button>
        </div>
      )}
      {msg && <div style={{ marginTop: 8, fontSize: 12, fontWeight: 600, color: status === "done" ? "#5B7F6E" : "#C75B4A" }}>{msg}</div>}
    </div>
  );
}

// ─── Image Gallery ───
function ImageGallery({ onPreview, folders, setFolders, onOpen3dModel }) {
  const [ghFolders, setGhFolders] = useState([]);
  const [activeFolder, setActiveFolder] = useState(null);
  const [folderFiles, setFolderFiles] = useState([]);
  const [ghLoading, setGhLoading] = useState(false);
  const [ghError, setGhError] = useState("");
  const [pdfViewer, setPdfViewer] = useState(null);
  const [showTokenInput, setShowTokenInput] = useState(false);
  const [tokenInput, setTokenInput] = useState("");
  const [hasToken, setHasToken] = useState(() => !!getGithubReadToken()); // { url, name }

  const inputStyle = { padding: "8px 10px", borderRadius: 7, border: "1.5px solid #DDD5C8", background: "#FBF8F2", fontSize: 13, color: "#3A2E22", outline: "none", fontFamily: "inherit" };

  // Fetch top-level folders from GitHub on mount
  useEffect(() => {
    fetchGhFolders();
  }, []);

  async function fetchGhFolders() {
    setGhLoading(true);
    setGhError("");
    try {
      const res = await fetch(`${GITHUB_API}`, { headers: ghApiHeaders() });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(`GitHub API: HTTP ${res.status}${errBody.message ? ` — ${errBody.message}` : ""}`);
      }
      const items = await res.json();
      // Get all subdirectories (bilder/, dokument/, 3d-modeller/ etc.)
      const topDirs = items.filter(i => i.type === "dir");
      // Recursively collect all sub-folders
      const allFolders = [];
      for (const dir of topDirs) {
        const sub = await fetch(`${GITHUB_API}/${dir.name}`, { headers: ghApiHeaders() });
        if (!sub.ok) continue;
        const subItems = await sub.json();
        const subDirs = subItems.filter(i => i.type === "dir");
        if (subDirs.length > 0) {
          for (const sd of subDirs) {
            const firstImg = subItems.find(i => i.type === "file" && isImageFile(i.name));
            allFolders.push({ path: sd.path, name: sd.name, parent: dir.name, thumb: null });
          }
          // Fetch thumbnails for each subfolder
          for (const sd of subDirs) {
            const subRes = await fetch(`${GITHUB_API}/${sd.path}`, { headers: ghApiHeaders() });
            if (!subRes.ok) continue;
            const subSubItems = await subRes.json();
            const firstImg = subSubItems.find(i => i.type === "file" && isImageFile(i.name));
            const folderEntry = allFolders.find(f => f.path === sd.path);
            if (folderEntry && firstImg) folderEntry.thumb = `${GITHUB_RAW}/${sd.path}/${firstImg.name}`;
          }
        } else {
          const hasFiles = subItems.some(i => i.type === "file" && (isImageFile(i.name) || isDocFile(i.name)));
          if (hasFiles) {
            const firstImg = subItems.find(i => i.type === "file" && isImageFile(i.name));
            allFolders.push({ path: dir.path, name: dir.name, parent: "", thumb: firstImg ? `${GITHUB_RAW}/${dir.path}/${firstImg.name}` : null });
          }
        }
      }
      setGhFolders(allFolders);
    } catch(e) {
      setGhError(e.message);
    }
    setGhLoading(false);
  }

  async function openFolder(folder) {
    setActiveFolder(folder);
    setFolderFiles([]);
    setGhLoading(true);
    try {
      const res = await fetch(`${GITHUB_API}/${folder.path}`, { headers: ghApiHeaders() });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const items = await res.json();
      const files = items.filter(i => i.type === "file" && (isImageFile(i.name) || isDocFile(i.name)));
      setFolderFiles(files);
      // Update thumb if not set
      if (!folder.thumb) {
        const firstImg = files.find(f => isImageFile(f.name));
        if (firstImg) {
          setGhFolders(prev => prev.map(f => f.path === folder.path ? { ...f, thumb: `${GITHUB_RAW}/${firstImg.path}` } : f));
        }
      }
    } catch(e) {
      setGhError(e.message);
    }
    setGhLoading(false);
  }

  const groupedFolders = ghFolders.reduce((acc, f) => {
    const key = f.parent || "Övrigt";
    if (!acc[key]) acc[key] = [];
    acc[key].push(f);
    return acc;
  }, {});

  function saveToken() {
    setGithubReadToken(tokenInput.trim());
    setHasToken(!!tokenInput.trim());
    setTokenInput("");
    setShowTokenInput(false);
    setGhError("");
    fetchGhFolders();
  }

  function clearToken() {
    setGithubReadToken("");
    setHasToken(false);
    setGhFolders([]);
  }

  return (
    <div>
      {pdfViewer && <PdfViewerModal url={pdfViewer.url} name={pdfViewer.name} onClose={() => setPdfViewer(null)} />}
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>
        <div>
          <h2 style={{ margin: 0, fontFamily: "'Playfair Display', Georgia, serif", color: "#3A2E22", fontSize: 22 }}>Bildarkiv</h2>
          <p style={{ margin: "4px 0 0", fontSize: 12, color: "#8A7D6B" }}>
            GitHub: {GITHUB_REPO} •
            <span style={{ marginLeft: 6, cursor: "pointer", color: "#5B7F6E", fontWeight: 600 }} onClick={fetchGhFolders}>⟳ Uppdatera</span>
            {" • "}
            <span style={{ cursor: "pointer", color: hasToken ? "#5B7F6E" : "#C75B4A", fontWeight: 600 }} onClick={() => setShowTokenInput(v => !v)}>
              {hasToken ? "🔑 Token satt" : "⚠ Sätt GitHub-token"}
            </span>
            {hasToken && <span style={{ cursor: "pointer", color: "#A89878", marginLeft: 6 }} onClick={clearToken}>✕</span>}
          </p>
        </div>
        <a href={`https://github.com/${GITHUB_REPO}`} target="_blank" rel="noreferrer"
          style={{ padding: "8px 14px", background: "#3A2E22", color: "#C4B89E", borderRadius: 8, fontSize: 12, fontWeight: 700, textDecoration: "none" }}>
          ↗ Öppna GitHub
        </a>
      </div>

      {/* Token input */}
      {showTokenInput && (
        <div style={{ background: "#FAF6EF", border: "1.5px solid #E5DDD0", borderRadius: 10, padding: 14, marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#8A7D6B", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>🔑 GitHub read-only token</div>
          <div style={{ fontSize: 11, color: "#A89878", marginBottom: 10 }}>
            Skapa ett Fine-grained token på github.com → Settings → Developer settings → Personal access tokens.<br/>
            Sätt <b>Contents: Read-only</b> på marga-repot. Sparas i din webbläsare, aldrig i koden eller GitHub.
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <input type="password" placeholder="github_pat_..." value={tokenInput} onChange={e => setTokenInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && saveToken()}
              style={{ flex: 1, padding: "7px 10px", borderRadius: 6, border: "1.5px solid #DDD5C8", background: "#FFFDF8", fontSize: 12, color: "#3A2E22", outline: "none", fontFamily: "inherit" }} autoFocus />
            <button onClick={saveToken} disabled={!tokenInput.trim()}
              style={{ padding: "7px 14px", background: tokenInput.trim() ? "#5B7F6E" : "#E5DDD0", color: tokenInput.trim() ? "#fff" : "#A89878", border: "none", borderRadius: 6, fontWeight: 700, fontSize: 12, cursor: tokenInput.trim() ? "pointer" : "default" }}>Spara</button>
          </div>
        </div>
      )}

      {ghError && (
        <div style={{ padding: "10px 14px", background: "#FFF0ED", borderRadius: 8, border: "1px solid #F5C4BA", fontSize: 12, color: "#C75B4A", marginBottom: 16 }}>
          ⚠ {ghError}
          {(ghError.includes("401") || ghError.includes("403") || ghError.includes("rate limit")) && (
            <span style={{ marginLeft: 8, cursor: "pointer", fontWeight: 700, textDecoration: "underline" }} onClick={() => setShowTokenInput(true)}>→ Sätt GitHub-token</span>
          )}
        </div>
      )}

      <div style={{ display: "flex", gap: 20, minHeight: 500 }}>
        {/* Sidebar */}
        <div style={{ width: 220, flexShrink: 0 }}>
          {ghLoading && !activeFolder && (
            <div style={{ color: "#A89878", fontSize: 12, padding: 12 }}>Hämtar mappar…</div>
          )}
          {Object.entries(groupedFolders).map(([group, foldersInGroup]) => (
            <div key={group} style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: "#A89878", textTransform: "uppercase", letterSpacing: "0.06em", padding: "4px 8px", marginBottom: 4 }}>{group}</div>
              {foldersInGroup.map(f => (
                <div key={f.path}
                  onClick={() => openFolder(f)}
                  style={{
                    display: "flex", alignItems: "center", gap: 10, padding: "7px 10px",
                    borderRadius: 8, cursor: "pointer", marginBottom: 3,
                    background: activeFolder?.path === f.path ? "#FFFDF8" : "transparent",
                    border: activeFolder?.path === f.path ? "1.5px solid #E5DDD0" : "1.5px solid transparent",
                    boxShadow: activeFolder?.path === f.path ? "0 2px 8px rgba(80,60,40,0.06)" : "none",
                    transition: "all 0.15s",
                  }}
                  onMouseEnter={e => { if (activeFolder?.path !== f.path) e.currentTarget.style.background = "rgba(255,253,248,0.5)"; }}
                  onMouseLeave={e => { if (activeFolder?.path !== f.path) e.currentTarget.style.background = "transparent"; }}
                >
                  {/* Thumbnail or folder icon */}
                  <div style={{ width: 36, height: 36, borderRadius: 6, overflow: "hidden", flexShrink: 0, background: "#E8E0D4", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    {f.thumb ? (
                      <img src={f.thumb} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }}
                        onError={e => { e.target.style.display = "none"; e.target.parentNode.innerHTML = '<span style="font-size:18px">📁</span>'; }} />
                    ) : (
                      <span style={{ fontSize: 18 }}>📁</span>
                    )}
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#3A2E22", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</div>
                </div>
              ))}
            </div>
          ))}
        </div>

        {/* File grid */}
        <div style={{ flex: 1, minWidth: 0 }}>

                      >
